<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="НБСС">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png">
  <title>НБСС</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="classic">
  <div id="banOverlay" class="ban-overlay" style="display:none;">
    <div class="ban-message"><h1>🚫 Вы забанены</h1><p id="banUntilText"></p></div>
  </div>

  <div class="notification-bell" id="notificationBell">🔔<span class="badge" id="notificationBadge" style="display:none;">0</span></div>
  <div class="notification-history" id="notificationHistory">
    <div class="notification-history-header">Уведомления</div>
    <div class="notification-history-list" id="notificationList"></div>
  </div>
  <div class="toast-container" id="toastContainer"></div>

  <div class="app-container">
    <aside class="sidebar sidebar-left">
      <div class="sidebar-logo"><img src="logo.png" alt="НБСС"><span class="logo-text">НБСС</span></div>
      <nav class="nav">
        <a class="nav-item active" data-page="home"><span>🏠</span> <span>Главная</span></a>
        <a class="nav-item" data-page="profile" id="navProfile" style="display:none"><span>👤</span> <span>Профиль</span></a>
        <a class="nav-item" data-page="events"><span>📅</span> <span>Ивенты</span></a>
        <a class="nav-item" data-page="admin" id="navAdmin" style="display:none"><span>⚙️</span> <span>Админка</span></a>
        <a class="nav-item" data-page="settings"><span>🎨</span> <span>Тема</span></a>
        <a class="nav-item" id="logoutLink" data-page="logout" style="display:none"><span>🚪</span> <span>Выйти</span></a>
        <a class="nav-item" id="loginLink" data-page="login"><span>🔑</span> <span>Войти</span></a>
        <a class="nav-item" id="registerLink" data-page="register"><span>📝</span> <span>Регистрация</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="search-box" style="margin:10px 20px;">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="🔍 Поиск..." class="search-input-field">
          <button id="searchButton" class="btn primary search-button">🔍</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>

      <!-- Главная -->
      <section id="homePage" class="page active">
        <div id="authBanner" class="auth-banner card" style="display:flex; justify-content:space-between; align-items:center;">
          <span>👋 Добро пожаловать в НБСС!</span>
          <span><button id="loginFromBanner" class="btn outline" data-page="login">Войти</button> <button id="registerFromBanner" class="btn outline" data-page="register">Регистрация</button></span>
        </div>
        <div id="postComposer" class="post-composer" style="display:none">
          <div class="composer-row">
            <input type="text" id="postInput" placeholder="Что происходит?" class="composer-input">
            <label class="composer-file-label">🖼️<input type="file" id="postImageInput" accept="image/*" multiple style="display:none;"></label>
            <button id="publishPost" class="btn primary composer-btn">Опубликовать</button>
          </div>
          <div class="image-preview-container" id="imagePreviewContainer"></div>
        </div>
        <div id="feedContainer" class="feed"></div>
      </section>

      <!-- Профиль -->
      <section id="profilePage" class="page"><div class="profile-header" id="profileHeader"></div><div id="profilePosts" class="feed"></div></section>

      <!-- Ивенты -->
      <section id="eventsPage" class="page">
        <div class="events-container"><h2>📅 Активные ивенты</h2><div id="eventsList"></div></div>
      </section>

      <!-- Админка -->
      <section id="adminPage" class="page">
        <div class="admin-container">
          <h2>⚙️ Административная панель</h2>
          <div class="card" id="adminStats"></div>
          <div class="card">
            <h3>👥 Пользователи</h3>
            <input type="text" id="adminUserSearch" placeholder="Ник..." class="admin-search-input">
            <button id="adminSearchButton" class="btn primary">🔍</button>
            <div id="adminSearchResults" class="admin-search-results"></div>
            <div id="adminSelectedUser" style="display:none;">
              <h4>Выбран: <span id="adminSelectedUsername"></span></h4>
              <div class="admin-actions">
                <button id="banUserBtn" class="btn outline">⛔ Бан 1ч</button>
                <button id="unbanUserBtn" class="btn outline">✅ Разбан</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Настройки -->
      <section id="settingsPage" class="page">
        <div class="card settings-card">
          <h2>⚙️ Настройки</h2>
          <div class="setting-row">
            <label>🎨 Тема</label>
            <div class="theme-options">
              <label class="theme-option-label"><input type="radio" name="theme" value="classic" checked><span class="theme-preview classic-preview"></span> Классическая</label>
              <label class="theme-option-label"><input type="radio" name="theme" value="liquid-light"><span class="theme-preview liquid-light-preview"></span> Liquid Glass Светлая</label>
              <label class="theme-option-label"><input type="radio" name="theme" value="liquid-dark"><span class="theme-preview liquid-dark-preview"></span> Liquid Glass Тёмная</label>
              <label class="theme-option-label"><input type="radio" name="theme" value="retro-light"><span class="theme-preview retro-light-preview"></span> Ретро ВК Светлая</label>
              <label class="theme-option-label"><input type="radio" name="theme" value="retro-dark"><span class="theme-preview retro-dark-preview"></span> Ретро ВК Тёмная</label>
            </div>
          </div>
        </div>
      </section>

      <!-- Вход -->
      <section id="loginPage" class="page">
        <div class="auth-center"><div class="card auth-card">
          <h2>🔐 Вход</h2>
          <input id="loginUsername" placeholder="Логин" autocomplete="username">
          <input id="loginPassword" type="password" placeholder="Пароль" autocomplete="current-password">
          <button id="loginBtn" class="btn primary full-width">Войти</button>
          <p>Нет аккаунта? <a id="showRegisterLink">Зарегистрироваться</a></p>
        </div></div>
      </section>

      <!-- Регистрация -->
      <section id="registerPage" class="page">
        <div class="auth-center"><div class="card auth-card">
          <h2>📝 Регистрация</h2>
          <input id="regUsername" placeholder="Логин">
          <input id="regPassword" type="password" placeholder="Пароль">
          <button id="registerBtn" class="btn primary full-width">Создать аккаунт</button>
        </div></div>
      </section>
    </main>

    <nav class="mobile-nav">
      <a class="mobile-nav-item active" data-page="home"><span>🏠</span></a>
      <a class="mobile-nav-item" data-page="profile" id="mobileNavProfile" style="display:none"><span>👤</span></a>
      <a class="mobile-nav-item" data-page="events"><span>📅</span></a>
      <a class="mobile-nav-item" data-page="admin" id="mobileNavAdmin" style="display:none"><span>⚙️</span></a>
      <a class="mobile-nav-item" data-page="settings"><span>🎨</span></a>
      <a class="mobile-nav-item" id="mobileLogoutLink" data-page="logout" style="display:none"><span>🚪</span></a>
      <a class="mobile-nav-item" id="mobileLoginLink" data-page="login"><span>🔑</span></a>
      <a class="mobile-nav-item" id="mobileRegisterLink" data-page="register"><span>📝</span></a>
    </nav>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
